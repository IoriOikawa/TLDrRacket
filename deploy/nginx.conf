# Include from nginx's http context, e.g. /etc/nginx/sites-enabled/tldrracket.
# Replace readings.example.com before enabling; Certbot adds HTTPS afterwards.
limit_req_zone $binary_remote_addr zone=tldrracket_api:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name readings.example.com;
    client_max_body_size 16k;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 95s;
    proxy_send_timeout 10s;

    location = /api/ask {
        limit_req zone=tldrracket_api burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
